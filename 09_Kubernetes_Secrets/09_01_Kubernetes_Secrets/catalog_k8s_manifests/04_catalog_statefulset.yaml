apiVersion: apps/v1
kind: StatefulSet

metadata:
  labels:
    app.kubernetes.io/name: catalog
    app.kubernetes.io/instance: catalog
    app.kubernetes.io/component: mysql
    app.kubernetes.io/owner: retail-store-sample
  name: catalog-mysql

spec:

  replicas: 1
  serviceName: catalog-mysql ## The name of the Headless Service to which the StatefulSet is associated
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog
      app.kubernetes.io/instance: catalog
      app.kubernetes.io/component: mysql
      app.kubernetes.io/owner: retail-store-sample
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog
        app.kubernetes.io/instance: catalog
        app.kubernetes.io/component: mysql
        app.kubernetes.io/owner: retail-store-sample

    spec:

      containers:
      - image: public.ecr.aws/docker/library/mysql:8.0
        name: mysql
        imagePullPolicy: IfNotPresent

        env:
        - name: MYSQL_ROOT_PASSWORD
          value: my-secret-pw
        - name: MYSQL_DATABASE
          value: catalogdb
        - name: MYSQL_USER
          #value: catalog_user
          valueFrom:
            secretKeyRef:
              name: catalog-db
              key: RETAIL_CATALOG_PERSISTENCE_USER
        - name: MYSQL_PASSWORD
          #value: kalyandb101
          valueFrom:
            secretKeyRef:
              name: catalog-db
              key: RETAIL_CATALOG_PERSISTENCE_PASSWORD

        ports:
        - containerPort: 3306
          name: mysql
          protocol: TCP

        volumeMounts:
        - name: catalog-mysql-persistent-storage
          mountPath: /var/lib/mysql

      volumes:
      - name: catalog-mysql-persistent-storage
        emptyDir: {} # This is a temporary storage volume that will be deleted when the pod is deleted. In production, you would typically use a PersistentVolumeClaim to provide persistent storage for your database.
