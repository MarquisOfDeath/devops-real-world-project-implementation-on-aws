apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-deployment
  namespace: default
  #annotations:
  # kubernetes.io/change-cause: "Upgraded catalog application to version 1.3.0"
  labels:
    app: catalog
    env: dev
    createdBy: MarquisOfDeath
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
        env: dev
        createdBy: MarquisOfDeath
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - image: public.ecr.aws/aws-containers/retail-store-sample-catalog:1.3.0
        imagePullPolicy: IfNotPresent
        name: catalog-pod-container
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          protocol: TCP
          containerPort: 8080
        resources:
          requests:
            cpu: 80m
            memory: 100Mi
          limits:
            cpu: 200m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
