apiVersion: v1
kind: Pod
metadata:
  labels:
    app: catalog
    env: dev
    createdBy: MarquisOfDeath
  name: catalog-pod
  namespace: default
spec:
  containers:
  - image: public.ecr.aws/aws-containers/retail-store-sample-catalog:1.3.0
    name: catalog-pod-container
    ports:
    - name: http
      protocol: TCP
      containerPort: 8080
    resources:
      requests:
        cpu: 80m
        memory: 100Mi
      limits:
        cpu: 200m
        memory: 256Mi
    readinessProbe:
      httpGet:
        path: /health
        port: 8080
  restartPolicy: Always
