apiVersion: v1
data:
  RETAIL_CATALOG_PERSISTENCE_DB_NAME: catalogdb
  RETAIL_CATALOG_PERSISTENCE_ENDPOINT: "catalog-mysql:3306"
  #RETAIL_CATALOG_PERSISTENCE_USER: "mydbadmin"
  #RETAIL_CATALOG_PERSISTENCE_PASSWORD: "kalyandb101"
  RETAIL_CATALOG_PERSISTENCE_PROVIDER: "mysql" # This is the database provider that the application will use. It can be set to either "mysql" or "postgresql". The application will use this value to determine which database driver to use for connecting to the database.
