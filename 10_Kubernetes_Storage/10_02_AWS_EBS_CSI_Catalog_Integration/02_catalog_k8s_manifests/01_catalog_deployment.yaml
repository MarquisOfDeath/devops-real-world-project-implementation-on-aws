apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: default
  #annotations:
  # kubernetes.io/change-cause: "Upgraded catalog application to version 1.3.0"
  labels:
    app.kubernetes.io/name: catalog
    app.kubernetes.io/instance: catalog
    app.kubernetes.io/component: service
    app.kubernetes.io/owner: retail-store-sample
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog
      app.kubernetes.io/instance: catalog
      app.kubernetes.io/component: service
      app.kubernetes.io/owner: retail-store-sample
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog
        app.kubernetes.io/instance: catalog
        app.kubernetes.io/component: service
        app.kubernetes.io/owner: retail-store-sample
    spec:
      serviceAccount: catalog-mysql-sa # Service Account
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - image: public.ecr.aws/aws-containers/retail-store-sample-catalog:1.3.0
        imagePullPolicy: IfNotPresent
        name: catalog-pod-container
        envFrom:
        - configMapRef:
            name: catalog
        ##- secretRef:
        ##    name: catalog-db
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          runAsNonRoot: true # This is a security best practice to ensure that the container does not run as root.
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          protocol: TCP
          containerPort: 8080
        resources:
          requests:
            cpu: 80m
            memory: 100Mi
          limits:
            cpu: 200m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10

        command: [ "/bin/bash", "-c" ]
        args:
        - |
          export RETAIL_CATALOG_PERSISTENCE_USER=$(cat /mnt/secrets-store/MYSQL_USER);
          export RETAIL_CATALOG_PERSISTENCE_PASSWORD=$(cat /mnt/secrets-store/MYSQL_PASSWORD);
          echo "Starting Catalog service with secure DB credentials";
          exec /app/main

        volumeMounts:
        - name: catalog-db-secrets
          mountPath: "/mnt/secrets-store" # This is the path where the secrets will be mounted inside the container. You can choose any path you like, but it should match the path specified in the SecretProviderClass you created in the previous step.
          readOnly: true

      volumes:
      - name: catalog-db-secrets
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "catalog-db-secrets" # This should match the name of the SecretProviderClass you created in the previous step.    
