apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ebs-sc
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete # 1. Ensure data isn't accidentally deleted if a PVC is removed
allowVolumeExpansion: true # Allows you to increase disk size later without downtime
parameters:
  type: gp3 # 2. Modern, cost-effective, high-performance volume
  encrypted: "true" # 3. Security best practice: Encrypt at rest
